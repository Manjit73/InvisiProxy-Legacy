proxySettings:
  donate: >-
    Offriamo domini premium, funzionalità in beta, connessioni ISP residenziali
    e velocità maggiori. Puoi fare una donazione su
    <patreon>Patreon</patreon>.<br/> Attiva Tor o l'instradamento regionale se
    hai difficoltà a usare i servizi. Se hai problemi con il proxy, consulta la
    pagina delle <faq>FAQ</faq>.
  title: Preferenze proxy
  connection: Connessione
  searchNavFix: Attiva le correzioni per i siti
  searchNavFixDescription: >-
    Usa il plugin creato da The Freedom Project per correggere errori come
    "undefined" durante la navigazione. Facoltativo.
  experimentalSiteFixes: Correzioni sperimentali per i siti
  experimentalSiteFixesDescription: >-
    Un insieme di correzioni manuali per la compatibilità dei siti. Potrebbero
    rompere alcuni siti e far trapelare il tuo vero IP: usale a tuo rischio.
  hideHistoryDescription: >-
    Nasconde la cronologia di navigazione locale. La rete può comunque
    intercettarla, ma il traffico passa dal proxy.
  randomizeFingerprint: Randomizza l'impronta del browser
  randomizeFingerprintDescription: >-
    Usa un browser desktop casuale per ogni sessione di scheda e aggiunge rumore
    alle letture di canvas, WebGL, CPU e memoria. Uno user agent scelto da te ha
    comunque la precedenza. Alcuni siti potrebbero non funzionare.
  customWisp: Server Wisp personalizzato
  customWispDescription: >-
    Instrada il traffico del proxy attraverso il tuo server Wisp per un maggiore
    controllo sulla privacy. Se vuoi far passare tutto il traffico dal tuo
    self-hosting, questo è un metodo leggero: usi l'interfaccia di questo sito,
    ma il traffico va ai tuoi server. Lascia vuoto per disattivarlo.
  invalidWisp: Inserisci un indirizzo ws:// o wss://.
  moreSettings: Mostra altre impostazioni
  anotherLink: >-
    Ti serve un altro link? Clicca sul <mirrors>pulsante dei link
    mirror</mirrors>.

faq:
  meta:
    title: FAQ di InvisiProxy | Errori di rete, CAPTCHA e problemi con YouTube
    description: >-
      Errore di rete, pagine vuote, CAPTCHA che si ripetono o YouTube che non si
      carica? Ecco come risolvere i problemi più comuni di InvisiProxy e se è
      sicuro accedere ai siti con il tuo account.
    social: >-
      Soluzioni rapide per errori di rete, pagine vuote, CAPTCHA che si ripetono
      e riproduzione su YouTube, più risposte sul supporto a Discord e su come
      accedere ai siti in sicurezza.
  title: Domande frequenti
  search: Cerca
  searchLabel: Cerca nelle domande frequenti
  icons:
    question: >-
      Come ottengo gli URL delle icone per il menu di camuffamento della scheda?
    bookmarklet: >-
      Vai sul sito da cui vuoi prendere l'icona, poi usa questo bookmarklet
      (trascinalo nella barra dei preferiti):
    button: Trova URL icona
    copy: >-
      Copia l'URL che ti fornisce il bookmarklet. Poi torna su InvisiProxy e
      inseriscilo come URL dell'icona nelle Impostazioni. Buona navigazione!
  networkError:
    question: >-
      Perché ricevo "Errore di rete" o un errore del sito ogni volta che uso il
      proxy?
    answer: >-
      È un problema noto dei nostri proxy web moderni. A causa del numero di
      utenti, di solito la connessione viene interrotta dopo dieci minuti di
      inattività della scheda. Basta premere il pulsante Aggiorna pagina e
      ricaricare la pagina per risolvere.
    note: >-
      Di solito succede la prima volta che usi il proxy. Abbiamo in programma
      una soluzione.
  bot:
    question: >-
      Ho problemi ad accedere ai siti o a vedere i contenuti perché mi scambiano
      per un bot.
    answer: >-
      Nelle ore di punta è molto comune, perché tutto il traffico passa da due
      soli indirizzi IP. La soluzione è cambiare la regione del proxy nelle
      impostazioni oppure attivare l'instradamento Tor. Puoi anche abbonarti al
      nostro Patreon per accedere a un'istanza con ISP residenziale ed evitare
      il problema.
  unreachable:
    question: >-
      Ricevo un errore simile a: "Impossibile raggiungere 'cdn.example.com'."
    answer: >-
      Ricarica la pagina. Se al primo tentativo non funziona, usa il pulsante
      Indietro del browser o torna alla pagina di Scramjet e riprova.
  blank:
    question: Perché il sito si carica solo in parte o resta vuoto?
    answer: >-
      Non tutti i siti web sono supportati. È inevitabile, data la vastità del
      web e la varietà di tecnologie e metodi con cui i contenuti vengono
      caricati. Se hai problemi con un sito specifico, segnalacelo sul nostro
      server Discord o su GitHub. Altrimenti prova le varie opzioni del proxy
      per vedere se una di queste supporta il sito.
  idb:
    question: >-
      Ricevo un errore che fa riferimento a un database IDB (problema di
      Scramjet V1)
    answer: >-
      Di solito succede quando aggiorniamo il progetto. Clicca sull'icona (i) in
      alto a sinistra nel browser (o sul lucchetto) e seleziona "Cancella dati
      sito" oppure "Cookie e dati dei siti > Gestisci dati sul dispositivo >
      icona del cestino". In questo modo il database IndexedDB viene svuotato e
      potrai usare di nuovo il proxy.
  discord:
    question: Discord è supportato?
    answer: Sì, Discord è supportato.
    note: >-
      Tuttavia, con i proxy gratuiti ci sono alcune limitazioni. Non usare il
      tuo account principale, a meno che tu non usi il self-hosting o un dominio
      con pochi utenti.
  youtube:
    question: Perché i video di YouTube non funzionano?
    answer: >-
      Se i problemi persistono anche dopo aver seguito i passaggi qui sopra, è
      possibile che l'istanza sia temporaneamente fuori servizio, soprattutto se
      molte persone hanno lo stesso problema. Con il self-hosting questo
      problema non si presenta.
    tor: >-
      Prova a selezionare l'opzione "Tor": potrebbe risolvere il problema, ma
      rallenta molto il caricamento.
  login:
    question: È sicuro accedere ai siti con il mio account?
    answer: >-
      Sì, è sicuro accedere ai siti. Tuttavia ti consigliamo di non accedere a
      siti di cui non ti fidi e di non usare account personali, vista la
      quantità di traffico che passa da un unico dominio. Cerchiamo di limitare
      il problema ruotando gli IP, ma è buona norma non usare account personali
      sui proxy pubblici. Con il self-hosting, invece, puoi farlo senza
      problemi. Puoi anche abbonarti al Patreon per usare un ISP residenziale ed
      evitare il problema.
  captcha:
    question: >-
      Perché il sito che sto usando non funziona correttamente o mostra errori
      CAPTCHA?
    answer: >-
      I CAPTCHA funzionano con Scramjet, ma servono un po' di tentativi. Il
      motivo è che Scramjet spesso è semplicemente troppo veloce e i CAPTCHA
      sono per natura molto capricciosi. La soluzione è continuare a provare a
      risolvere il CAPTCHA finché non funziona. Cerca di non andare troppo
      veloce.
  youtubeBlank:
    question: >-
      Quando uso YouTube su uno dei siti proxy, perché la pagina non si carica
      del tutto o il video resta bianco?
    answer: 'Ci sono due modi per risolvere:'
    reload: >-
      Ricarica normalmente la pagina quando compare l'errore descritto sopra: il
      video dovrebbe caricarsi.
    reloadFrame: >-
      Oppure fai clic destro sulla pagina e scegli <code>Ricarica frame</code>,
      se stai usando una modalità Stealth.

privacy:
  title: Informativa sulla privacy
  subtitle: InvisiProxy, un servizio di proxy web privato.
  effective: 'Data di decorrenza: 16/07/2021'
  updated: 'Ultimo aggiornamento: 31/10/2026'
  what:
    title: Che cos'è InvisiProxy?
    body: >-
      InvisiProxy LTS è un servizio di proxy web che ti aiuta ad accedere ai
      siti che potrebbero essere bloccati dalla tua rete, dal tuo governo o da
      regole interne, il tutto dal browser, senza download né configurazioni. Lo
      fa in modo sicuro e con funzionalità aggiuntive per la privacy. Naviga sui
      siti Tor/Onion da qualsiasi browser, nascondi la tua attività di
      navigazione e aggira i filtri. Questo include la potenziale capacità di
      aggirare i blocchi dei contenuti imposti dai governi, le estensioni di
      Chrome, i firewall locali dei dispositivi e i filtri di rete.<br/>Questo
      progetto nasce soprattutto come proof of concept della soluzione ideale
      per aggirare la censura senza installare nulla.
  data:
    title: Vengono raccolti dati?
    body: >-
      InvisiProxy di per sé non registra né raccoglie la tua navigazione. I log
      sono disattivati sul backend per tutelare la privacy degli utenti. L'unica
      eccezione è il pulsante dei link mirror, che conserva il tuo indirizzo IP
      in memoria per pochi secondi per prevenire gli abusi; non viene mai
      scritto su disco. I partner pubblicitari sui domini con pubblicità
      raccolgono i propri dati, come descritto più avanti nella sezione
      Pubblicità. Le query NextDNS sono configurate per non registrare gli IP
      dei client né i domini, e i dati sono conservati in Svizzera. La
      conservazione dei log di NextDNS, limitata ai valori numerici, è minima e
      serve a garantire il corretto funzionamento del servizio. Cloudflare viene
      usato in questo progetto per migliorare le prestazioni e semplificare la
      gestione dei DNS, vista la portata del progetto. Come minimo, i dati
      numerici di Cloudflare vengono usati per contare visite e visualizzazioni
      di pagina, così da capire quando servono potenziamenti dei server. NGINX è
      configurato per non conservare alcun log. InvisiProxy LTS tiene fede al
      suo impegno di porre fine alla censura su internet e di tutelare la
      privacy degli utenti. Oltre a questo, il protocollo Wisp (per instradare
      le connessioni TCP) viene usato con libcurl-transport per la crittografia
      end-to-end, eseguendo SSL/TLS all'interno di WebAssembly. Questo servizio
      è pensato per essere il più trasparente possibile e ricorda che puoi
      ospitarlo tu stesso in qualsiasi momento, per avere il pieno controllo su
      tutto.<br/><br/>Se vuoi fare una dichiarazione o una richiesta relativa
      alla privacy, contattaci su Discord.
  security:
    title: Sicurezza
    body: >-
      InvisiProxy LTS è costruito da zero per offrire ai suoi utenti un servizio
      di proxy web sicuro e affidabile. Una delle tecnologie alla base di
      InvisiProxy LTS è il nuovo protocollo Wisp, sviluppato da Mercury
      Workshop.<br/><br/>Questo protocollo introduce diverse funzionalità e
      miglioramenti innovativi che contribuiscono alla velocità e alla sicurezza
      del servizio rispetto ai modelli precedenti.
    intro: >-
      Il protocollo Wisp è progettato per gestire le esigenze del traffico web
      moderno mantenendo elevati standard di sicurezza. Implementando Wisp,
      questo progetto ottiene i seguenti vantaggi:
    performance: >-
      Prestazioni: il protocollo Wisp ottimizza la velocità di trasferimento dei
      dati TCP, garantendo agli utenti una latenza minima durante la
      navigazione.
    compatibility: >-
      Compatibilità: Wisp è progettato per essere compatibile con un'ampia gamma
      di tecnologie web, garantendo un accesso fluido a siti e servizi online di
      ogni tipo. Questo avviene grazie al supporto di vari trasporti open source
      che seguono il protocollo (Libcurl Transport).
    censorship: >-
      Resistenza alla censura: il protocollo è progettato per aggirare le
      tecniche di censura sofisticate usate dalle reti restrittive, permettendo
      agli utenti di accedere con facilità ai contenuti bloccati.
    fingerprinting: >-
      Resistenza al fingerprinting: questo progetto dispone di solidi meccanismi
      contro il fingerprinting nella configurazione del reverse proxy delle
      istanze ufficiali. Ciò significa che il proxy è progettato per ridurre al
      minimo gli identificatori univoci che possono essere usati per tracciare o
      identificare gli utenti, migliorando così la privacy. Seguendo le migliori
      pratiche del settore e aggiornando costantemente i propri metodi, permette
      agli utenti di navigare in modo anonimo senza lasciare tracce
      identificabili.
    transparency: >-
      Trasparenza: la trasparenza è un principio chiave di InvisiProxy LTS. Il
      progetto adotta un modello open source, che permette alla community di
      esaminare il codice e di contribuire. Questa apertura non solo favorisce
      la fiducia, ma consente anche un miglioramento continuo grazie ai feedback
      e alla collaborazione della community. Adottando pratiche trasparenti,
      InvisiProxy LTS fa in modo che gli utenti sappiano come vengono trattati i
      loro dati e quali misure sono in atto per proteggere la loro privacy.
    randomisation: >-
      Randomizzazione del codice sorgente e globale: per migliorare
      ulteriormente sicurezza e privacy, InvisiProxy LTS usa la randomizzazione
      del codice sorgente e delle variabili globali. Questo permette al progetto
      di restare sbloccato più a lungo sui domini e migliora anche l'anonimato
      durante la navigazione. I proxy web tradizionali lasciano tracce ogni
      volta che riscrivono le risorse, ma con questo metodo è molto più
      difficile rilevare il proxy e bloccarlo.
    encryption: >-
      Crittografia: InvisiProxy LTS usa tecnologie proxy avanzate incentrate
      sulla crittografia end-to-end e sul trasferimento sicuro dei dati, in
      particolare nel contesto dei proxy che riscrivono gli URL. NOTA: è ancora
      un lavoro in corso, con molto da fare, e aperto ai contributi.
    audits: >-
      Audit regolari: vengono condotti audit di sicurezza periodici per
      individuare e correggere potenziali vulnerabilità.
  advertising:
    title: Pubblicità
    body: >-
      Alcuni domini di InvisiProxy mostrano annunci per coprire i costi di
      hosting. Le istanze Patreon sono sempre senza pubblicità. Gli annunci sono
      forniti da reti di terze parti: Adsterra, Adcash e Monetag. Compaiono solo
      nelle pagine e nelle schermate di caricamento di InvisiProxy, mai
      all'interno dei siti che visiti tramite il proxy.<br/><br/>Quando un
      annuncio viene caricato, la rete pubblicitaria riceve il tuo indirizzo IP,
      lo user agent del browser, il dominio che stai visitando e dettagli
      tecnici simili, e può impostare o leggere i propri cookie o usare
      tecnologie simili per mostrare annunci, limitare quante volte li vedi,
      misurarne il rendimento e prevenire le frodi. Queste reti possono eseguire
      il proprio codice nelle nostre pagine; il modo in cui trattano i tuoi dati
      è regolato dalle loro informative sulla privacy, non dalla
      nostra.<br/><br/>Puoi bloccare gli annunci con un'estensione per il blocco
      dei contenuti come uBlock Origin, oppure usare un'istanza Patreon.
  usage:
    title: Cookie e archiviazione locale
    storage: >-
      InvisiProxy usa "cookie", IndexedDB, localStorage e sessionStorage per
      mantenere una sessione utente (descritta più avanti) e salvare le tue
      preferenze sul tuo computer. Tutte queste informazioni restano sul tuo
      dispositivo e InvisiProxy non ne usa nessuna a fini statistici. I partner
      pubblicitari possono salvare i propri cookie, come descritto nella sezione
      Pubblicità.
    cookies: >-
      Un cookie è una stringa di informazioni che un sito web salva sul computer
      di chi lo visita e che il browser invia al sito ogni volta che il
      visitatore ritorna. InvisiProxy usa i cookie per garantire il corretto
      funzionamento del menu Impostazioni e, infine, per le preferenze
      dell'utente. Chi non desidera che vengano salvati cookie sul proprio
      computer dovrebbe impostare il browser per rifiutarli prima di usare i
      siti di InvisiProxy, tenendo presente che alcune funzionalità di
      InvisiProxy NON funzioneranno correttamente senza cookie, localStorage o
      IndexedDB. InvisiProxy non usa cookie, IndexedDB, localStorage o
      sessionStorage a fini statistici; li usano solo le seguenti funzioni, per
      salvare dati persistenti in locale: Scramjet (cache delle risorse caricate
      tramite proxy, stato della sessione, ecc.), schede, preferiti,
      completamento automatico (tramite proxy) e il menu Impostazioni
      (camuffamento della scheda, icone preimpostate, opzioni di trasporto,
      motori di ricerca, temi, lingua, tipo di finestra, instradamento Tor,
      cambio di regione, nascondi annunci, cronologia nascosta, blocco delle
      fughe dalle finestre, blocco di WebRTC e randomizzazione dell'impronta).
    serviceWorkers: >-
      Inoltre, InvisiProxy usa i Service Worker come tecnologia per i propri
      proxy web. Questo permette di intercettare il traffico di rete interessato
      e altro ancora, ed è una funzione fondamentale del progetto.
    consent: >-
      Continuando a navigare sul nostro sito senza modificare le impostazioni
      dei cookie, riconosci e accetti l'uso dei cookie da parte di InvisiProxy e
      i cookie dei partner pubblicitari descritti sopra, laddove la legge non
      richieda un tuo consenso separato.
  changes:
    title: Nota finale
    body: >-
      Sebbene la maggior parte delle modifiche sarà probabilmente di poco conto,
      InvisiProxy può modificare di tanto in tanto la propria Informativa sulla
      privacy, a sola discrezione di InvisiProxy LTS. InvisiProxy LTS invita i
      visitatori a controllare spesso questa pagina per eventuali modifiche
      all'Informativa sulla privacy. Se continui a usare questo sito dopo una
      modifica dell'Informativa sulla privacy, accetti tale modifica. In caso di
      abusi o attacchi DDoS, InvisiProxy LTS potrebbe essere costretto a
      registrare temporaneamente dei dati per mitigare l'attacco e garantire
      l'operatività del servizio. In questi casi, tutti i dati registrati
      verranno eliminati in modo sicuro subito dopo la mitigazione dell'attacco.
  contact:
    title: Contatti e crediti
    body: >-
      Per qualsiasi domanda sulla nostra Informativa sulla privacy, contattaci
      via email all'indirizzo

docs:
  chemical: >-
    Prova <chemical>Chemical</chemical> se vuoi creare da zero il tuo servizio
    di proxy web.
  chemicalButton: Crea il tuo sito proxy con Chemical
  formerly: In precedenza Holy Unblocker LTS
  badges:
    ci: Stato di GitHub Actions
    dockerVersion: Versione dell'immagine Docker
    dockerPulls: Pull dell'immagine Docker
  intro: >-
    <strong>InvisiProxy LTS</strong> (in precedenza Holy Unblocker LTS) è un
    servizio di proxy web sperimentale in grado di aggirare i filtri web o
    "blocchi", che la censura avvenga sul dispositivo o a livello di rete.
    Questo include la possibilità di aggirare i blocchi dei contenuti imposti
    dai governi, le estensioni di Chrome, i firewall locali dei dispositivi e i
    filtri di rete. Il progetto permette perfino di navigare sui siti Tor/Onion
    da qualsiasi browser (anche Chromium), il tutto tramite un sito web!
  star: Puoi sostenere InvisiProxy aggiungendo una stella al repository!
  about: >-
    Questo progetto nasce soprattutto come proof of concept della soluzione
    ideale per aggirare la censura senza installare nulla. È utile, per esempio,
    se ti serve un modo per usare Tor, cambiare regione durante la navigazione
    (o usare un proxy esterno), navigare sui siti senza creare account
    (riducendo il fingerprinting), aggirare le restrizioni sull'adblock e/o
    lasciare tracce minime dell'attività sul dispositivo. Ti basta ospitare
    questo progetto su un dominio qualsiasi per avere un'alternativa a una VPN,
    senza dover scaricare nulla sul dispositivo. Essendo un servizio di proxy
    web sicuro, supporta numerosi siti, viene aggiornato spesso e punta a essere
    facile da ospitare in autonomia. InvisiProxy LTS funziona con un gran numero
    di siti, tra cui YouTube, Gemini, ChatGPT, Discord, GeForce NOW e altri
    ancora! Il progetto offre anche diverse funzionalità esclusive rispetto ad
    altri proxy web per aggirare i filtri web (mascheramento del DOM e
    randomizzazione del codice sorgente) e la censura dei vari paesi. Al momento
    sono supportate Cina (GFW) e Russia.
  users: >-
    Oltre 30 milioni di utenti dal 2020. Grazie di cuore per il supporto: non
    avrei mai immaginato quanto sarebbe diventata grande la community dei proxy
    web.
  branches:
    current: 'Branch attuale: Latest'
    title: Tipi di branch
    latest: Latest (master; pensato per FOSS e SEO)
    beta: Beta (modifiche in attesa; potrebbero rompere qualcosa)
    production: >-
      Production (v4, v5, v6; versione stabile di InvisiProxy LTS. Modifiche per
      il self-hosting in ambienti di produzione; massima elusione dei filtri e
      gestione ottimale delle richieste)
    switch: Valuta di passare a un branch di produzione per il self-hosting!
  selfHost: >-
    Consulta le <deploy>opzioni di deploy in autonomia</deploy> se vuoi ospitare
    tu stesso questo progetto. Non riesci a fare il deploy con nessuna delle
    opzioni gratuite? Dai un'occhiata a Koyeb o valuta soluzioni di hosting VPS
    economiche a pagamento. Se non vuoi ospitarlo tu, clicca sul menu dei link
    mirror di InvisiProxy.
  discord: >-
    Unisciti al Discord di TitaniumNetwork per altri link ufficiali al sito:
  caution:
    title: Attenzione
    body: >-
      Se intendi ospitare InvisiProxy LTS in autonomia, passa al branch
      PRODUCTION, dove le funzionalità di elusione dei filtri sono attive
      automaticamente. Il branch master contiene modifiche in lavorazione non
      ancora pronte per il self-hosting. Se invece vuoi contribuire al progetto,
      apri le PR sul branch master.
  tip:
    title: Suggerimento
    body: >-
      InvisiProxy LTS è ottimizzato per il self-hosting, per darti il massimo
      controllo sulla privacy! Fai un fork di questo repository e valuta di
      aggiungere una stella. Puoi ospitarlo con opzioni di deploy gratuite o a
      pagamento, oppure configurarlo su un'istanza dedicata (VPS) per
      prestazioni migliori.
  sites:
    site: Siti supportati
    features: Funzionalità
    youtube: >-
      Varietà integrata di proxy web open source, incentrati sulla velocità e/o
      sulla sicurezza
    reddit: >-
      Randomizzazione del codice sorgente e mascheramento del DOM per aggirare
      efficacemente i principali filtri, oltre alla randomizzazione delle
      variabili globali del proxy
    discord: >-
      Personalizzazione di titolo e icona della scheda dal menu Impostazioni,
      per una cronologia di navigazione più discreta
    instagram: >-
      Blocco delle pubblicità su tutti i siti durante la navigazione e DNS a
      bassa latenza sui server ufficiali
    tor: >-
      Supporto per SOCKS5 e instradamento Onion con Tor dal menu Impostazioni.
      Usa i siti Tor/Onion da qualsiasi browser!
    geforce: >-
      Funzionalità esclusive rispetto ad altri proxy web per aggirare i filtri
      web e la censura dei vari paesi.
    chatgpt: >-
      Cronologia di navigazione locale nascosta, prevenzione delle fughe dalle
      schede e traffico di rete offuscato!
    spotify: Aggira i blocchi regionali cambiando regione o attivando Tor
    more: E in pratica quasi tutti i siti!
