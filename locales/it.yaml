# Traduzione italiana di InvisiProxy LTS (locales/it.yaml), basata su en.yaml.
# Chiavi, {segnaposto} e <tag> sono identici all'inglese: si traduce solo il
# testo tra i tag.
#
# Convenzioni, per chi rivede o continua la traduzione:
#   - Si dà del tu, come nella maggior parte dei siti e delle app in italiano.
#   - Termini allineati a Chrome e Firefox in italiano: tab = scheda,
#     bookmark = preferiti, address bar = barra degli indirizzi,
#     history = cronologia, settings = Impostazioni.
#   - bypass = aggirare, unblock = sbloccare, routing = instradamento,
#     fingerprint = impronta del browser. Restano in inglese self-hosting,
#     deploy, branch, proxy, mirror, user agent e i nomi di prodotti e opzioni.
#   - Date nel formato italiano (GG/MM/AAAA).

language:
  name: Italiano

  # Codici paese (ISO 3166-1) inviati da Cloudflare nell'header CF-IPCountry.
  # CH è esclusa di proposito: in Svizzera l'italiano è lingua di minoranza.
  countries:
