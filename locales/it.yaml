scramjetError:
  title: Errore di rete di Scramjet
  failed: 'Impossibile caricare:'
  reload: Ricaricare la pagina potrebbe risolvere il problema.
  refresh: Aggiorna pagina
  copy: Copia
  try: 'Cosa puoi provare:'
  tips:
    reload: 'Ricaricare la pagina: è un problema noto di Scramjet'
    idb: >-
      In caso di errore del database IDB, cancellare i dati del sito cliccando
      sull'icona del lucchetto nella barra degli indirizzi, selezionando
      "Impostazioni sito" o "Dati del sito" e poi "Cancella dati del sito"
    cache: >-
      Svuotare la cache del browser o del sito con Ctrl+Maiusc+R. Puoi anche
      andare su Impostazioni > Privacy > Cancella dati del sito su Invisi
    address: Verificare di aver inserito l'indirizzo corretto
    maintenance: >-
      In caso di manutenzione o aggiornamenti del sito, attendere che il
      problema venga risolto.
    censored: >-
      Verificare che il server non sia censurato dalla tua rete (WebRTC, ecc.)
    faq: >-
      Consultare la pagina delle FAQ per problemi di compatibilità con siti
      specifici.
    github: >-
      Cercare una soluzione all'errore su <github>GitHub di Scramjet.</github>
    engine: >-
      Provare un trasporto proxy o una regione diversi dal pannello delle
      impostazioni.
  network: Aggiorna il servizio di rete
  love: Fatto con amore
