home:
  title: >-
    InvisiProxy LTS | Proxy web gratuito - Aggira i filtri e accedi ai siti
    bloccati
  description: >-
    InvisiProxy LTS è un servizio di proxy web all'avanguardia, pensato per
    aggirare filtri e blocchi del web. Che la censura avvenga sul dispositivo o
    a livello di rete, InvisiProxy LTS ti dà accesso senza intoppi ai siti
    bloccati e ti permette di navigare in modo sicuro e privato su dispositivi
    come i Chromebook. Supera blocchi dei contenuti, estensioni di Chrome,
    firewall e molto altro con la nostra soluzione proxy avanzata.
  ogDescription: >-
    InvisiProxy LTS è un servizio di proxy web di prim'ordine che aggira le
    restrizioni di rete e del browser per accedere in sicurezza ai siti
    bloccati. Goditi una navigazione fluida, con una sicurezza solida e
    funzionalità avanzate.
  twitterDescription: >-
    Scopri InvisiProxy LTS, un servizio di proxy web di alto livello che aggira
    censura e filtri per darti accesso sicuro ai siti bloccati. Ideale per
    navigare in privato e superare le restrizioni di rete su dispositivi come i
    Chromebook.

  headline: Stop alla censura su internet.
  tagline: La privacy a portata di mano.
  browseNow: Naviga ora
  bypassNow: Sblocca ora
  donate: Dona
  logoAlt: Logo principale di InvisiProxy

  terminal:
    setup: Per la prima configurazione su un branch di produzione...
    start: Oppure, per l'uso di tutti i giorni...
    dev: Per lo sviluppo...

  free:
    title: InvisiProxy è gratuito.
    body: >-
      Essendo open source, puoi fare facilmente un fork di questo repository e
      ospitarlo tu stesso per avere il massimo controllo sulla privacy. Rispetto
      a molti altri servizi di proxy web, InvisiProxy si distingue per la
      crittografia end-to-end tramite TLS, l'isolamento della cronologia del
      browser, l'instradamento Tor/Onion nei browser Chromium, la totale
      trasparenza e il controllo sulla privacy. <strong>A differenza di altri
      servizi proxy, sulle nostre istanze ufficiali non raccogliamo alcun dato
      degli utenti. Nemmeno per il debug.</strong><br/>Le nostre dipendenze open
      source (Wisp, Libcurl ed Epoxy) sono progettate per essere sicure e
      rispettose della privacy, così la tua navigazione resta riservata anche su
      istanze self-hosted gestite da malintenzionati.

  fast:
    title: InvisiProxy è veloce e molto avanzato.
    body: >-
      InvisiProxy offre prestazioni eccezionali come proxy web. Vanta un ricco
      insieme di funzionalità: supporto a reCAPTCHA/Botguard, rete Tor,
      proxychaining SOCKS5, blacklist personalizzabile, protezione dalle fughe
      di dati, cronologia nascosta e un'ampia compatibilità con i siti grazie a
      Scramjet + Wisp (abbinati al trasporto Libcurl). Altri servizi popolari
      come CroxyProxy o Proxium spesso fanno solo metà del lavoro nella
      riscrittura delle risorse, lasciando trapelare richieste, e in più sono un
      rischio per la privacy. Questo progetto supporta anche il proxychaining,
      che ti permette di instradare il traffico attraverso più proxy per una
      sicurezza e un anonimato maggiori.

  practical:
    title: InvisiProxy è pratico.
    body: >-
      Grazie alla randomizzazione del codice sorgente e a progetti come Proxy
      Transports, Wisp e Scramjet, questo progetto offre un'esperienza fluida
      che aggira i filtri del web, dei governi e delle reti. Funziona contro i
      filtri usati in Cina (GFW - il Great Firewall cinese), in Russia e
      altrove, <strong>senza bisogno di scaricare alcun software</strong>. Tutto
      avviene interamente nel browser, come un normale sito web, tramite il
      nostro backend (o il tuo, se lo ospiti tu stesso), così puoi aggirare
      anche i blocchi di censura più invasivi. Non serve scaricare nulla: digita
      il dominio di InvisiProxy, vai sul sito ufficiale di InvisiProxy per
      ottenere dei mirror se è bloccato e naviga in modo anonimo.

  heroSubtitle: Gratuito e trasparente da usare
  designedWithPrivacy: Progettato per la privacy<underline/>.

  overview:
    title: Panoramica
    body: >-
      InvisiProxy LTS, un servizio di proxy web sperimentale, può aggirare i
      filtri web o "blocchi", che la censura avvenga sul dispositivo o a livello
      di rete. Questo include la possibilità di aggirare i blocchi dei contenuti
      imposti dai governi di altri paesi (Cina/GFW, Russia, ecc.), le estensioni
      di Chrome, i firewall locali dei dispositivi e i filtri di rete.
    donate: >-
      Valuta una donazione a questo progetto, così possiamo mantenerlo gratuito!
      Offriamo più domini al mese, accesso alle beta, domini personali e
      priorità sulle richieste di funzionalità.<br/>Puoi fare una donazione
      <patreon>qui su Patreon</patreon>.
    patreonLabel: Dona su Patreon
    imageAlt: Icona di un server

  intent:
    title: Scopo
    body: >-
      Questo progetto nasce soprattutto come proof of concept della soluzione
      ideale per aggirare la censura senza installare nulla. Essendo un servizio
      di proxy web sicuro, supporta numerosi siti, viene aggiornato spesso e
      cura nel dettaglio design, meccaniche e funzionalità.
    palette: >-
      La palette di questo progetto si basa su <nord>Nord Theme</nord>, scelto
      per la sua combinazione di colori ottimale e per l'attenzione alla
      leggibilità della sintassi del codice e dei componenti dell'interfaccia.
    imageAlt: Icona di un file di codice

  usage:
    title: Come si usa
    body: >-
      Vai alla pagina <browse>Naviga</browse> e scegli uno dei proxy
      disponibili! Poi digita nella casella di ricerca il sito che vuoi
      visitare. Ogni proxy web ha un proprio livello di efficacia, velocità e
      sicurezza. Ti consigliamo di usare Scramjet.<br/><br/>Esempio di sito da
      sbloccare: <code>https://youtube.com</code>
    imageAlt: Icona di uno scudo

  apps:
    title: App
    body: >-
      InvisiProxy include una raccolta di applicazioni già collegate, tra cui
      YouTube, Spotify, GeForce NOW, Discord, ChatGPT, Gemini e molte altre!
    imageAlt: Icona di un'applicazione

  hosting:
    title: Hosting e deploy
    body: >-
      <strong>InvisiProxy LTS</strong> è una soluzione open source progettata
      all'insegna della modularità, della facilità d'uso e di un deploy
      semplice. Tra le funzionalità principali ci sono il blocco delle
      pubblicità, la generazione flessibile del codice sorgente e una
      navigazione proxy avanzata.<br/><br/>Per le istruzioni di configurazione
      complete, visita il nostro <github>repository GitHub</github> ufficiale o
      la <docs>documentazione integrata disponibile qui</docs>.
    docsTitle: Altre informazioni sull'hosting
    imageAlt: Icona hosting e deploy
    imageTitle: Hosting e deploy di InvisiProxy LTS

  contributing:
    title: Contribuire
    body: >-
      <strong>InvisiProxy LTS</strong> cresce grazie all'impegno dei nostri
      fantastici collaboratori. Come progetto open source, <strong>InvisiProxy
      LTS</strong> si affida alla passione della sua community per aggirare la
      censura su internet e aiutare le persone ad accedere più facilmente alle
      informazioni.
    start: >-
      Per iniziare a contribuire, visita il nostro <github>repository
      GitHub.</github>
    imageAlt: Icona GitHub per contribuire
    imageTitle: Contribuisci a InvisiProxy LTS su GitHub

  githubTitle: Repository GitHub di InvisiProxy LTS

  bypass:
    title: Aggira censura e filtri
    body: >-
      InvisiProxy LTS è un <strong>progetto di proxy web</strong> open source.
      Goditi un accesso senza restrizioni ai contenuti online e alla navigazione
      grazie alle nostre funzionalità avanzate di <strong>sblocco tramite proxy
      web</strong>. Questo progetto ti permette anche di ospitarlo ovunque in
      autonomia e di aggirare i blocchi nazionali o regionali, come quelli di
      Cina (Great Firewall cinese - GFW) e Russia.

  freeProxy:
    title: Proxy web gratuito al 100%
    body: >-
      Approfitta del nostro <strong>servizio di proxy web gratuito</strong>, che
      ti aiuta a <strong>sbloccare siti web</strong> e ad accedere a contenuti
      con restrizioni. Perfetto per aggirare i filtri di scuola e/o lavoro:
      questo progetto è fatto per sbloccare tutto.

  tor:
    title: Usa l'instradamento Tor nei browser Chromium e in Firefox
    body: >-
      Con InvisiProxy LTS puoi <strong>accedere alla rete Tor</strong>
      direttamente dal tuo browser basato su Chromium o su Firefox. Questo
      significa che puoi aprire i siti <strong>.onion</strong> direttamente da
      questo sito web. Così puoi navigare in modo anonimo (almeno in parte: il
      vero Tor offre protezioni migliori contro il fingerprinting) e aggirare
      eventuali restrizioni regionali. Questo progetto supporta anche
      l'impostazione di proxy SOCKS5 personalizzati per il proxychaining.

  unrestricted: Navigazione libera e senza restrizioni
  closing: È ora di navigare su internet in libertà.
  tryFree: Prova InvisiProxy gratis

