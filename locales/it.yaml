    mirrors: >-
      Per semplicità puoi unirti al Discord di TN su discord.gg/unblock e
      richiedere i link dei siti mirror (che vengono riforniti e sbloccati).
    hosting: Hosting
    hostingBody: >-
      Se invece vuoi ospitarlo tu stesso, ti servirà prima un VPS o un provider
      di hosting:
    dependencies: Dipendenze
    dependenciesBody: >-
      Poi dovrai installare git, musl, nginx (o caddy) e Node.js. Ecco un
      esempio per Ubuntu LTS:
    tor: Supporto Tor (facoltativo)
    configure: Configurare InvisiProxy
    configureBody: >-
      Le opzioni più importanti sono production e le tecniche di offuscamento e
      di mascheramento del DOM.
    configureMore: 'Da lì, configura secondo le tue esigenze:'
    run: Clonare ed eseguire InvisiProxy
    runBody: >-
      Poi avvia il processo; se nella configurazione hai impostato production su
      true, pm2 verrà attivato automaticamente con il nostro sistema di worker e
      cache.
    restart: >-
      Infine, se hai usato NGINX o Caddy, ricordati di riavviarlo o ricaricarlo
  config:
    title: Configurazione
    server: Configurazione del server
    port: >-
      La PORTA predefinita del proxy all'avvio è
      <code>http://localhost:8080</code>. Se necessario, puoi cambiare la PORTA
      e altri parametri di produzione in <code>./ecosystem.config.js</code>.
    local: >-
      Tutte le altre modifiche locali per la randomizzazione del codice
      sorgente, la minificazione automatica, ecc. si trovano in
      <code>./config.json</code>.
    options:
      minifyScripts: >-
        Minifica automaticamente le risorse statiche all'avvio del server.
      randomizeIdentifiers: >-
        Attiva la randomizzazione sperimentale delle variabili globali del proxy
        per Ultraviolet. Riduce le probabilità che UV venga rilevato dai filtri
        basati su estensioni.
      production: >-
        Usa una configurazione di produzione preimpostata per l'hosting su
        server. Include già la gestione della cache e le riscritture del codice
        sorgente.
      disguiseFiles: >-
        Attiva il mascheramento del DOM, che offusca le vere richieste di
        contenuti di InvisiLTS. Funziona camuffando le richieste,
        decomprimendole e poi ricostruendo l'albero DOM.
      usingSEO: >-
        Attiva la randomizzazione del codice sorgente, che rende casuale il
        sorgente scambiando blocchi di dati specificati in
        <code>./src/data.json</code>. Molto utile per mascherare le parole
        chiave che farebbero segnalare o bloccare automaticamente InvisiProxy
        LTS, oltre a prevenire i blocchi basati sul sorgente.
      verbose: >-
        Mostra i messaggi di compilazione e di build, per seguire l'avanzamento
        e i possibili problemi durante la compilazione.
      mirrorLinksFile: >-
        File usato solo dal server per il distributore della pagina dei link,
        con valore predefinito <code>private/mirror-links.txt</code>. I percorsi
        relativi vengono risolti a partire dalla radice del progetto; sono
        supportati anche i percorsi assoluti. Inserisci un URL HTTP(S) per riga
        e tieni il file fuori da <code>views/</code>, così non viene servito
        pubblicamente. Riavvia il server dopo aver modificato questa
        impostazione.
      geoLanguage: >-
        Attiva la selezione automatica della lingua tramite l'header
        <code>CF-IPCountry</code> di Cloudflare. Attivala solo dietro
        Cloudflare, perché altrimenti l'header può essere impostato da chiunque.
        I paesi sono elencati per ogni lingua in <code>language.countries</code>
        in ciascun file <code>./locales/*.yaml</code>.
      singleLanguage: >-
        Se è <code>true</code>, viene compilata solo la lingua impostata in
        <code>language</code> e tutti i visitatori ricevono quella, con
        l'impostazione Lingua nascosta. Utile per Docker o per altri deploy che
        richiedono una sola lingua, perché le build sono più veloci e leggere.
        Il valore predefinito è <code>false</code>.
      language: >-
        La lingua da compilare quando <code>singleLanguage</code> è attivo,
        corrispondente a un file in <code>./locales/</code> (es. <code>it</code>
        per <code>it.yaml</code>). Il valore predefinito è <code>en</code>. Per
        Docker, impostala in <code>config.json</code> prima di eseguire
        <code>docker build</code> o <code>docker compose build</code>, perché le
        lingue vengono scelte al momento della build.
  translations:
    title: Traduzioni
    crowdin: >-
      InvisiProxy LTS viene tradotto su <crowdin>Crowdin</crowdin> e chiunque
      può contribuire senza toccare il codice. Unisciti al progetto, scegli una
      lingua e inizia a tradurre. Le traduzioni completate vengono sincronizzate
      automaticamente in <code>./locales/</code>.
    rules: >-
      Consulta <readme/> per le regole di traduzione (segnaposto, tag e termini
      mascherati). Se la tua lingua non è presente su Crowdin, apri una issue o
      chiedi su Discord.
  tor:
    title: Configurazione dell'instradamento Tor/Onion/SOCKS5
    intro: >-
      Devi configurare Tor (va bene senza interfaccia grafica, ma anche con; in
      quel caso sostituisci la porta 9050 con la 9150) perché l'impostazione di
      instradamento Onion funzioni!
    guide: 'Ospita Tor seguendo questa guida:'
    cliGuide: 'Guida alternativa (da riga di comando):'
    body: >-
      Se ospiti InvisiProxy LTS su un VPS con Ubuntu, valuta di collegare Tor a
      systemctl per gestirlo più facilmente in produzione. Una volta che Tor è
      attivo su Linux o Windows, funzionerà automaticamente con InvisiProxy LTS
      quando l'utente lo attiva dal menu Impostazioni.
    customWisp: >-
      Gli utenti possono anche impostare un proprio server Wisp nelle Preferenze
      proxy.
    customProxy: >-
      Se vuoi usare un proxy HTTP/HTTPS/SOCKS5 personalizzato per instradare il
      traffico di Scramjet, la gestione avviene sul server in
      <code>./src/server/wisp.ts</code>.
  proxy:
    title: Configurazione del proxy
    body: >-
      Il file principale in cui modificare le impostazioni dei proxy web
      assegnate tramite il menu Impostazioni è
      <code>./views/assets/js/register-sw.js</code>. Qui puoi modificare le
      opzioni di trasporto impostate localmente tramite un cookie, sostituire i
      proxy SOCKS5, cambiare le porte dell'instradamento Onion, specificare una
      blacklist e altro ancora.
    options:
      stockSW: >-
        Il file di configurazione predefinito del service worker per
        Ultraviolet. In InvisiProxy, però, il blocco delle pubblicità è attivo
        automaticamente, quindi di default non viene usato.
      blacklistSW: >-
        Una versione modificata di Ultraviolet che permette di mettere in
        blacklist i domini e di bloccare le pubblicità.
      proxyUrl: >-
        Specifica un URL con protocollo SOCKS5/HTTPS/HTTP, che per impostazione
        predefinita punta alla porta proxy predefinita di Tor. Può essere
        sostituito con qualsiasi porta valida o proxy SOCKS5. Questo avviene
        tramite l'opzione proxy sia per epoxy sia per libcurl.
      transports: >-
        Specifica le porte da scambiare tramite Bare-Mux per usare Wisp.
      wispUrl: Modifica il percorso o la gestione dell'URL per Wisp
      defaultMode: >-
        Specifica il trasporto predefinito usato a livello globale (gli utenti
        possono comunque cambiarlo dal menu Impostazioni)
      ScramjetController: >-
        Questo costruttore permette di cambiare dinamicamente il prefisso usato
        per Scramjet e di specificare la posizione dei file. Nota: se cambi i
        nomi dei file, potrebbe essere necessario modificare
        <code>./views/scram/scramjet.sw</code>.
  navigation:
    title: Configurazione della navigazione lato client
    body: >-
      Il file principale per gli script di navigazione lato client è
      <code>./views/assets/js/common.js</code>. Viene usato soprattutto per la
      funzionalità Omnibox (motore di ricerca), per cambiare le opzioni del
      proxy e per altre impostazioni del client.
    options:
      getDomain: >-
        Questa costante serve a specificare i sottodomini da rimuovere quando si
        inserisce un URL nell'omnibox.
      goFrame: Specifica il frame stealth usato da InvisiProxy LTS
      sx: >-
        Questa costante specifica il motore di ricerca da usare tramite proxy
        quando l'utente digita qualcosa che non è un URL
      search: >-
        Queste funzioni specificano e analizzano le query usate per gli URL
        inviati
      urlHandler: Serve a impostare le funzioni dell'oggetto goProx.
      goProx: >-
        Questa costante permette di mappare la gestione degli URL per proxy
        specifici o per link che devono passare da un proxy web.
      prSet: >-
        Collega tramite goProx gli event listener ai pulsanti o ai campi di
        input necessari
      huLinks: >-
        Prende automaticamente i percorsi indicati in
        <code>./views/assets/json</code> e li aggiunge in base alla pagina e
        all'uso. Serve a nascondere i link che porterebbero ai blocchi dei
        filtri e a semplificare l'aggiunta di nuove app.
  structure:
    title: Struttura
    summary: Pagine web
    info: Informazioni sulla struttura
    root:
      views: >-
        Qui si trova la base fisica del sito di InvisiProxy, da cui vengono
        servite le risorse statiche.
      src: >-
        Per l'implementazione futura delle funzionalità di offuscamento e
        rimozione delle parole chiave.
    views: Dettagli di <code>/views/</code>
    folders:
      dist: contiene i file minificati. Si genera durante la build.
      pages: contiene l'HTML del sito.
      assets: contiene vari file CSS, JS, immagini e JSON.
      scram: >-
        contiene l'implementazione locale di Scramjet. Alcuni file vengono
        sostituiti da quelli del modulo node.
      uv: contiene l'implementazione di UV.
    scripts: Script presenti in <code>/views/assets/js/</code>
    files:
      card: >-
        aggiunge un elegante effetto visivo ai riquadri mostrati nella schermata
        di benvenuto.
      common: >-
        viene usato in tutte le pagine e fa funzionare la maggior parte delle
        funzionalità del sito, come il completamento automatico.
      csel: >-
        gestisce il menu Impostazioni, la funzione omnibox e altre funzionalità
        aggiuntive.
      loader: viene usato come risorsa per il mascheramento del DOM.
      registerSw: >-
        crea e gestisce i service worker che fanno funzionare Ultraviolet, e usa
        anche il bare transport.
  future:
    title: Sviluppi futuri
    body: >-
      <todo>Questa</todo> è la nostra lista, non esaustiva, delle cose da fare
      per InvisiProxy LTS.
  beginners:
    title: Spiegazione sommaria per principianti su proxy esterni e hosting
    intro: >-
      Per prima cosa dovrai ospitare i tuoi proxy in locale o su un server
      esterno.
    hosting: 'Elenco di alcune buone opzioni di hosting:'
    current: Provider di hosting attuale
    paid: A pagamento
    freePaidDedicated: Gratuito, a pagamento, dedicato
    freeAndPaid: Gratuito e a pagamento
    preference: >-
      Tra i provider di hosting elencati, Dedipath e Azure sono i preferiti.
      Puoi anche ospitarlo tu stesso.
    cloudflare: >-
      Una volta scelto un buon VPS, usa Cloudflare per i record DNS sia del sito
      sia dei sottodomini dei proxy.
    dns: >-
      Ecco un esempio di record DNS. Il self-hosting richiede preferibilmente
      dei <code>record A</code>.
    dnsAlt: Record DNS
    root: >-
      <code>@</code> e <code>www.example.com</code> vengono usati per
      InvisiProxy LTS.
    subdomain: >-
      <code>a.example.com</code> viene usato per altre istanze come Libreddit o
      Invidious, a seconda di ciò che serve al gestore del sito.
    local: >-
      Come detto in precedenza, InvisiProxy è ospitato in locale con Scramjet e
      Ultraviolet già pronti all'uso. Non servono istanze esterne.
  domain:
    title: Passaggi per il dominio
    porkbun: >-
      Se preferisci acquistare domini premium (TLD), usa
      <porkbun>Porkbun</porkbun>, che offre domini a prezzi ottimi. Pensa che un
      dominio <code>.org</code> costa normalmente circa 5 dollari il primo anno.
  cloudflare:
    title: Passaggi per Cloudflare
    account: >-
      Usa Cloudflare (crea un account), aggiungi il tuo sito e poi aggiungi a
      Cloudflare le varie destinazioni DNS. Assicurati di impostare i nameserver
      di Cloudflare, che ti verranno forniti più avanti mentre aggiungi il sito.
    records: >-
      Assicurati che siano record CNAME (anche i record A funzionano) e cerca di
      seguire questa struttura:
    columns: Tipo | Nome | Destinazione
    ip: INSERISCI QUI L'IP DEL VPS
    ssl: >-
      Assicurati che HTTPS sia forzato e imposta SSL su Flexible (se non usi
      Let's Encrypt). Altrimenti puoi impostare SSL su Full.
  workspace:
    title: Configurazione dell'ambiente di lavoro
    vsc: >-
      Se hai un tuo dispositivo, usa preferibilmente <vsc>Visual Studio
      Code</vsc>. È praticamente l'opzione migliore che ci sia, ma ovviamente è
      un'opinione. Assicurati anche di avere <node>Node.JS</node> installato sul
      tuo computer.
    fork: >-
      Non entrerò troppo nei dettagli di questa parte, ma prima di tutto fai un
      fork di questo repository. Poi clonalo in locale tramite un terminale, a
      seconda del sistema operativo che usi. Assicurati di spostarti nella
      cartella in cui vuoi configurarlo.
    gitignore: >-
      Ora aggiungi semplicemente in VSC la cartella in cui hai clonato il repo.
      Poi esegui <code>pnpm install</code>. Se lo pubblichi su GitHub, ti
      consiglio di aggiungere nella cartella principale un file
      <code>.gitignore</code> con le seguenti esclusioni:
    deploy: >-
      Ora il tuo ambiente di lavoro è pronto. Per fare il deploy dell'ambiente
      appena creato, dovrai informarti in base al tuo provider di hosting.
    gitpod: >-
      Se ti serve un IDE online da usare sul computer della scuola e/o sul
      Chromebook, usa Gitpod. In pratica è l'equivalente di Visual Studio Code,
      ma funziona nel browser.
    gitpodAccount: 'Crea un account:'
    gitpodFork: >-
      Fai un fork di questo repo e inserisci questo URL per configurare il tuo
      ambiente di lavoro:
    gitpodSteps: >-
      Segui gli stessi passaggi descritti sopra: esegui <code>pnpm
      install</code> nel tuo repository e aggiungi nella cartella principale un
      file <code>.gitignore</code> che escluda <code>node_modules</code>.
  faq:
    title: FAQ dettagliate
    summary: FAQ rapide
    games: Dove trovo i giochi di questo repo? (errori 404, ecc.)
    gamesBody: Leggi <games>qui</games>.
    captcha: >-
      Perché il sito che sto usando non funziona correttamente o mostra errori
      CAPTCHA?
    captchaBody: >-
      Purtroppo il supporto ai CAPTCHA è instabile su tutti i proxy attuali. È
      supportato principalmente da Scramjet. Di conseguenza, alcuni siti
      potrebbero non funzionare con nessuno dei proxy.
    badGateway: Ricevo errori 502. Cosa devo fare?
    badGatewayBody: >-
      In questo caso puoi cambiare sito per risolvere l'errore oppure aspettare
      un po'. A volte svuotare la cache aiuta.
    questions: >-
      Se hai ancora domande, chiedi pure sul server Discord indicato qui.
    domains: >-
      Perché ora i domini ufficiali sono numerati? Il progetto è di nuovo
      mantenuto?
    domainsBody: >-
      Sì, questo progetto è di nuovo attivo con supporto LTS! L'approccio ora
      però è molto più semplice, per garantirne il funzionamento: domini
      riforniti quando serve e un codice sorgente molto curato. Più che mai,
      questo progetto è una dimostrazione per le anime coraggiose disposte a
      innovare nel campo dei servizi di proxy web.
  closing:
    summary: Vecchio messaggio di chiusura (originale - 2022)
    announcement: >-
      Non è il più bello degli annunci, scusate. Dopo averci riflettuto a lungo,
      e con molta esitazione, ho deciso di chiudere Holy Unblocker e lasciare
      TN. È una cosa che mi tormenta da mesi, da qui la mancanza di
      aggiornamenti e i lunghi vuoti dell'anno scorso. Semplicemente non volevo
      buttare via un progetto che ho amato con passione e a cui ho dedicato
      tempo, stringendo amicizie fantastiche e conoscendo sviluppatori
      incredibili qui. Potrei parlare all'infinito di chi sono queste persone,
      ma mi fermo qui. Loro sanno chi sono :D
    reasons: >-
      Il motivo principale di questo cambio di idea è che ho deciso di mettere
      un punto adesso per 1) mancanza di motivazione 2) la community NON è
      sempre il massimo e a volte non è la più gentile (dovevo dirlo) 3) il
      futuro di HU/TN come progetto non sembra molto roseo.
    secrets: >-
      Alcune cose preferisco tenerle per me, perché dietro questa scelta ci sono
      anche altri motivi, anche se a qualcuno queste informazioni potrebbero non
      bastare. Gli amici più stretti qui sanno quanto questa decisione mi abbia
      stressato negli ultimi mesi. In ogni caso, un'altra buona ragione è che
      presto finirò gli studi.
    future: >-
      Potrei continuare o tornare su questo progetto in futuro, oppure tenerlo
      solo su GitHub. Lo scrivo perché ancora adesso ho dei dubbi su questa
      decisione. Ma per ora vi consiglio di dare un'occhiata ad altri siti proxy
      come Incognito (Duce fa TANTISSIMI aggiornamenti ed è il
      creatore/sviluppatore di Ultraviolet, quindi fategli sentire un po'
      d'affetto) :yayy_hopi:
    patreon: >-
      Date un'occhiata anche al suo Patreon! Gli attuali sostenitori di HU non
      riceveranno addebiti il mese prossimo e il Patreon di HU verrà archiviato,
      quindi passate al Patreon di Duce, così potrà comprare altri domini per
      Incognito.
    signoff: Con affetto <3
  more:
    title: Altre informazioni
    maintained: >-
      Questo progetto è mantenuto dal team di InvisiProxy LTS ed è uno dei siti
      proxy web ufficiali di punta di TitaniumNetwork.
    website: Visita il sito ufficiale per maggiori dettagli e per i crediti.
    sources: 'Sorgenti dei proxy web:'
    sourcesBody: >-
      Al momento questo progetto usa Scramjet e Ultraviolet come proxy web
      conformi al protocollo Wisp. Bare-Mux viene usato per cambiare i sistemi
      di trasporto da usare con Wisp. I sistemi di trasporto inclusi sono
      EpoxyTransport e libcurl-transport.
    wispProtocol: Protocollo Wisp
    merp: Merp (modulo di offuscamento)
    dnsBlocklists: Blocklist DNS di hagezi
    dependencies: 'Altre dipendenze:'
    mentions: 'Menzioni speciali:'
    hostingProvider: Provider di hosting
  meta:
    title: Documentazione di InvisiProxy | Self-hosting, configurazione e Tor
    description: >-
      Ospita InvisiProxy in autonomia: installalo con pnpm, configuralo in
      config.json, instrada il traffico tramite Tor o un proxy SOCKS5 e scopri a
      cosa serve ogni dipendenza.
    social: >-
      Avvia la tua istanza di InvisiProxy. Copre installazione, config.json,
      instradamento Tor e SOCKS5 e le librerie su cui si basa il progetto.

apps:
  intro: >-
    Seleziona un sito qui sotto per aprirlo tramite il proxy. Evita di accedere
    con i tuoi account principali, perché questo è un servizio proxy pubblico.
    Ti consigliamo di creare account alternativi e di attivare l'autenticazione
    a due fattori (2FA), perché alcuni siti allentano le restrizioni in presenza
    di questi requisiti. Milioni di richieste passano da un numero ristretto di
    IP, quindi alcuni siti potrebbero bloccare l'accesso.
  patreon: >-
    Valuta di abbonarti al nostro <patreon>Patreon</patreon> se vuoi far passare
    il tuo traffico da un ISP residenziale affidabile e avere velocità maggiori.
    Se hai problemi, puoi anche attivare l'instradamento Tor o cambiare la
    regione del proxy. Per usare GeForce Now, disattiva le pubblicità dalle
    impostazioni del proxy.
  faq: Se hai problemi con il proxy, consulta la pagina delle <faq>FAQ</faq>.
  loading: Caricamento delle applicazioni…
  categories:
    all: Tutte
    featured: In evidenza
    social: Social
    chat: Chat
    video: Video
    music: Musica
    games: Giochi
    ai: IA
    education: Istruzione
    opensource: Open source

partners:
  title: Servizi partner
  intro: >-
    Esplora i progetti dei nostri partner. Funzionano tramite il proxy, così
    puoi usarli qui senza blocchi.
  features: >-
    I nostri partner offrono funzionalità come giochi sbloccati, port per il web
    ed emulazione. Tutti i partner sono open source e gratuiti. Valuta di unirti
    alle loro community e di sostenerli, se puoi. Seguono tutti un modello
    simile a InvisiProxy, quindi unisciti ai rispettivi server Discord per altri
    link.

credits:
  title: Crediti
  intro: >-
    InvisiProxy LTS è un servizio di proxy web ufficiale in grado di aggirare i
    filtri web, che siano basati su estensioni o sulla rete.<br/>Questo progetto
    ti permette di accedere a contenuti altrimenti bloccati da governi, scuole o
    luoghi di lavoro.
  name: Nome
  contributions: Contributi
  contact: Note e contatti
  iconAlt: icona
  sections:
    developers: Sviluppatori principali
